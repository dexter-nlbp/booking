<style>
:root{
  --ink:#0f1b2d; --ink-2:#3c4a5e; --muted:#6b7a90; --line:#e4e9f0; --line-2:#eef2f7;
  --bg:#f3f6fa; --card:#ffffff; --blue:#0f6bdc; --blue-2:#0a56b3; --blue-soft:#eaf2fd;
  --green:#169c2e; --green-soft:#e9f7ec; --red:#b42318; --red-soft:#fdeceb;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.04),0 12px 32px -8px rgba(16,24,40,.12);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(1200px 500px at 10% -10%,#e3effd 0%,transparent 60%),
  radial-gradient(900px 400px at 110% 0%,#e6f6ea 0%,transparent 55%),var(--bg);
  min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9cc3f5;outline-offset:2px;border-radius:8px}
.shell{max-width:1060px;margin:0 auto;padding:40px 20px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  display:grid;grid-template-columns:320px 1fr;overflow:hidden;min-height:600px}

/* ---------- profile panel ---------- */
.profile{padding:28px 26px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;
  background:linear-gradient(180deg,#fbfdff 0%,#fff 100%)}
.logo{height:54px;width:auto;align-self:flex-start;margin-left:-4px}
.me{display:flex;flex-direction:column;gap:12px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #fff;
  box-shadow:0 0 0 1px var(--line),0 6px 16px -6px rgba(16,24,40,.25)}
.me .name{font-size:22px;font-weight:750;letter-spacing:-.01em;margin:0}
.me .role{color:var(--ink-2);font-size:14px;margin:2px 0 0}
.facts{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:10px;color:var(--ink-2);font-size:14px}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts svg{flex:0 0 18px;margin-top:1px;color:var(--muted)}
.blurb{color:var(--ink-2);font-size:14px;margin:0;padding-top:14px;border-top:1px solid var(--line-2)}
.selected-pill{display:none;background:var(--blue-soft);color:var(--blue-2);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600}
.selected-pill.on{display:block}

/* ---------- scheduler ---------- */
.sched{padding:28px 28px 24px;display:flex;flex-direction:column;min-width:0}
.step-title{font-size:19px;font-weight:720;margin:0 0 4px;letter-spacing:-.01em}
.step-sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.durations{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:#b9cff0}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

.tzbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--green-soft);color:#14532d;
  border:1px solid #cdebd4;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:18px}
.tzbar strong{font-weight:700}
.tzbar span{flex:1;min-width:200px}
.tzbar button{background:none;border:0;color:var(--blue);font-weight:650;cursor:pointer;padding:2px 4px;text-decoration:underline}
.tzpick{display:none;margin:-8px 0 18px}
.tzpick.on{display:block}
.tzpick input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.tzpick select{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;max-height:220px}

.picker{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:26px;flex:1;min-height:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{font-size:15px;margin:0;font-weight:700}
.navbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center}
.navbtn:disabled{opacity:.35;cursor:default}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow div{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.day{aspect-ratio:1/1;border-radius:50%;border:0;background:transparent;font-size:14.5px;font-weight:600;color:#a8b3c3;cursor:default;position:relative}
.day.avail{background:var(--blue-soft);color:var(--blue-2);cursor:pointer}
.day.avail:hover{background:#d6e6fb}
.day.sel{background:var(--blue);color:#fff}
.day.today::after{content:"";position:absolute;left:50%;bottom:16%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.times{display:flex;flex-direction:column;min-height:0}
.times h4{margin:4px 0 10px;font-size:14.5px;font-weight:700}
.fmt{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;align-self:flex-start}
.fmt button{border:0;background:#fff;padding:4px 10px;font-size:12.5px;font-weight:650;cursor:pointer}
.fmt button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tlist{overflow:auto;max-height:380px;display:grid;gap:8px;padding-right:4px}
.slot{border:1px solid #b9cff0;color:var(--blue-2);background:#fff;border-radius:10px;padding:11px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.12s}
.slot:hover{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* ---------- form & states ---------- */
.summary{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14.5px}
.summary .t{font-weight:700}
form{display:grid;gap:14px;max-width:520px}
label{font-size:13.5px;font-weight:650;display:block;margin-bottom:6px}
label .opt{color:var(--muted);font-weight:500}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;transition:.12s}
input:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #d6e6fb}
.hp{position:absolute!important;left:-9999px!important}
.row{display:flex;gap:10px;margin-top:4px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-2)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.err{background:var(--red-soft);color:var(--red)}
.note.info{background:var(--blue-soft);color:var(--blue-2)}
.done{max-width:560px}
.check{width:56px;height:56px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;margin-bottom:14px}
.skeleton{background:linear-gradient(90deg,#eef2f7 25%,#f6f8fb 50%,#eef2f7 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:16px}
.back-link{background:none;border:0;color:var(--blue);font-weight:650;cursor:pointer;padding:0;margin-bottom:14px;align-self:flex-start}

@media (max-width:900px){
  .card{grid-template-columns:1fr}
  .profile{border-right:0;border-bottom:1px solid var(--line)}
  .picker{grid-template-columns:1fr}
  .tlist{max-height:none;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .me{flex-direction:row;align-items:center;gap:14px}
  .avatar{width:72px;height:72px}
  .shell{padding:16px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  availabilityUrl: "https://hook.us1.make.com/ht8c4hiivqtu26dfsb1bkwlgw1nqi5yj",
  bookingUrl: "https://hook.us1.make.com/ron8r2kzienhlgud1xipb19kl34hy2m2",
  contactEmail: "dexter.magaoay@nlbprogram.com",
  minNoticeHours: 12,
  daysAhead: 21,
  bufferMin: 15,
  // Booking window, every day: 9:00 PM to 4:00 AM Philippine time (PH has no DST),
  // which is 13:00 to 20:00 UTC. A meeting must start and end inside the window.
  windowUtc: { startMin: 13 * 60, endMin: 20 * 60 },
  types: [
    { id: "15", label: "15 min", long: "15-minute call", minutes: 15, step: 15 },
    { id: "30", label: "30 min", long: "30-minute meeting", minutes: 30, step: 30 },
    { id: "60", label: "60 min", long: "60-minute meeting", minutes: 60, step: 30 },
  ],
};
const DEMO = CONFIG.availabilityUrl.startsWith("__") || CONFIG.bookingUrl.startsWith("__");

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (ms, opts) => new Intl.DateTimeFormat("en-US", { timeZone: state.tz, ...opts }).format(new Date(ms));
const dayKey = ms => { const p = new Intl.DateTimeFormat("en-CA", { timeZone: state.tz, year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date(ms)); return p; };
function tzLabel(tz) {
  try {
    const off = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(new Date()).find(p => p.type === "timeZoneName").value;
    return `${tz.replace(/_/g, " ")} (${off})`;
  } catch { return tz; }
}
function validTz(tz) { try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return true; } catch { return false; } }

/* ============ STATE ============ */
const detected = Intl.DateTimeFormat().resolvedOptions().timeZone;
const state = {
  tz: validTz(detected) ? detected : "UTC",
  type: CONFIG.types[1], h24: false,
  busy: null, loading: true, loadError: false,
  month: null, day: null, slot: null, error: "", done: null, tzOpen: false,
};

/* ============ DATA ============ */
async function loadBusy() {
  state.loading = true; state.loadError = false; render();
  try {
    if (DEMO) {
      await new Promise(r => setTimeout(r, 400));
      const b = Date.now() + 2 * 86400000;
      state.busy = [{ start: b, end: b + 5400000 }];
    } else {
      const r = await fetch(CONFIG.availabilityUrl, { method: "POST", body: new URLSearchParams({ tz: state.tz }) });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (!Array.isArray(data.busy)) throw new Error("bad");
      state.busy = data.busy.map(b => ({ start: Date.parse(b.start), end: Date.parse(b.end) }));
    }
  } catch { state.busy = null; state.loadError = true; }
  state.loading = false; render();
}

function allSlots() {
  if (!state.busy) return [];
  const t = state.type, step = t.step * 60000, len = t.minutes * 60000, buf = CONFIG.bufferMin * 60000;
  const earliest = Date.now() + CONFIG.minNoticeHours * 3600000;
  const last = Date.now() + CONFIG.daysAhead * 86400000;
  const out = [];
  for (let s = Math.ceil(earliest / step) * step; s <= last; s += step) {
    const d = new Date(s), m = d.getUTCHours() * 60 + d.getUTCMinutes();
    if (m < CONFIG.windowUtc.startMin || m + t.minutes > CONFIG.windowUtc.endMin) continue;
    if (!state.busy.some(b => s < b.end + buf && s + len > b.start - buf)) out.push(s);
  }
  return out;
}
function slotsByDay() {
  const m = new Map();
  for (const s of allSlots()) { const k = dayKey(s); if (!m.has(k)) m.set(k, []); m.get(k).push(s); }
  return m;
}

/* ============ RENDER ============ */
function renderProfile() {
  $("#factDuration").textContent = state.type.long.replace("-", " ").replace(/^\w/, c => c.toUpperCase());
  $("#factTz").textContent = tzLabel(state.tz);
  const pill = $("#selectedPill");
  if (state.slot) { pill.classList.add("on"); pill.textContent = whenText(state.slot); } else pill.classList.remove("on");
}

function whenText(s) {
  const e = s + state.type.minutes * 60000, tf = { hour: "numeric", minute: "2-digit", hourCycle: state.h24 ? "h23" : "h12" };
  return `${fmt(s, { weekday: "long", month: "long", day: "numeric" })}, ${fmt(s, tf)} to ${fmt(e, tf)}`;
}

function tzBar() {
  const zones = Intl.supportedValuesOf ? Intl.supportedValuesOf("timeZone") : [state.tz, "UTC", "America/Denver", "Asia/Manila"];
  return `
    <div class="tzbar" role="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Times are shown in <strong>your time zone</strong>: ${esc(tzLabel(state.tz))}${state.tz === detected ? " (detected automatically)" : ""}.</span>
      <button type="button" id="tzToggle">${state.tzOpen ? "Done" : "Change"}</button>
    </div>
    <div class="tzpick ${state.tzOpen ? "on" : ""}">
      <input id="tzSearch" placeholder="Search a city or time zone" aria-label="Search time zones">
      <select id="tzSelect" size="6" aria-label="Time zone">${zones.map(z => `<option value="${esc(z)}" ${z === state.tz ? "selected" : ""}>${esc(z.replace(/_/g, " "))}</option>`).join("")}</select>
    </div>`;
}

function bindTz() {
  $("#tzToggle").onclick = () => { state.tzOpen = !state.tzOpen; render(); if (state.tzOpen) $("#tzSearch").focus(); };
  const sel = $("#tzSelect"), search = $("#tzSearch");
  if (!sel) return;
  search.oninput = () => { const q = search.value.toLowerCase().replace(/ /g, "_"); [...sel.options].forEach(o => o.hidden = q && !o.value.toLowerCase().includes(q)); };
  sel.onchange = () => { state.tz = sel.value; state.tzOpen = false; state.day = null; state.month = null; render(); };
}

function render() {
  renderProfile();
  const main = $("#main");
  if (state.done) return renderDone(main);
  if (state.slot) return renderForm(main);

  const chips = CONFIG.types.map(t => `<button type="button" class="chip" data-id="${t.id}" aria-pressed="${t.id === state.type.id}">${t.label}</button>`).join("");
  let body;
  if (state.loading) {
    body = `<div class="picker"><div class="skeleton" style="height:320px"></div><div class="skeleton" style="height:320px"></div></div>`;
  } else if (state.loadError) {
    body = `<div class="note err">We couldn't load available times right now. Please try again in a minute, or email <a href="mailto:${CONFIG.contactEmail}">${CONFIG.contactEmail}</a>.</div>
            <div class="row"><button class="btn ghost" id="retry">Try again</button></div>`;
  } else {
    body = pickerHtml();
  }
  main.innerHTML = `
    ${DEMO ? `<div class="note info" style="margin-bottom:14px">Preview mode: sample availability, nothing is booked.</div>` : ""}
    <h2 class="step-title">Select a date and time</h2>
    <p class="step-sub">Choose a meeting length, then pick an open time.</p>
    <div class="durations" role="group" aria-label="Meeting length">${chips}</div>
    ${tzBar()}
    ${state.error ? `<div class="note err" style="margin-bottom:14px">${esc(state.error)}</div>` : ""}
    ${body}`;
  main.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.type = CONFIG.types.find(t => t.id === b.dataset.id); state.day = null; state.error = ""; render(); });
  bindTz();
  if ($("#retry")) $("#retry").onclick = loadBusy;
  if (!state.loading && !state.loadError) bindPicker();
}

function pickerHtml() {
  const byDay = slotsByDay();
  const keys = [...byDay.keys()];
  if (!keys.length) return `<p class="empty">No open times in the next ${CONFIG.daysAhead} days. Please email <a href="mailto:${CONFIG.contactEmail}">${CONFIG.contactEmail}</a>.</p>`;
  if (!state.day || !byDay.has(state.day)) state.day = keys[0];
  if (!state.month) state.month = state.day.slice(0, 7);

  const [y, m] = state.month.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)), dim = new Date(Date.UTC(y, m, 0)).getUTCDate(), lead = first.getUTCDay();
  const todayKey = dayKey(Date.now());
  const months = [...new Set(keys.map(k => k.slice(0, 7)))].concat(todayKey.slice(0, 7)).sort();
  const minM = months[0], maxM = months[months.length - 1];
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<span></span>`;
  for (let d = 1; d <= dim; d++) {
    const k = `${state.month}-${String(d).padStart(2, "0")}`, av = byDay.has(k);
    const label = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" });
    cells += `<button type="button" class="day ${av ? "avail" : ""} ${k === state.day ? "sel" : ""} ${k === todayKey ? "today" : ""}"
      ${av ? `data-k="${k}"` : "disabled"} aria-label="${label}${av ? ", available" : ", unavailable"}" ${k === state.day ? 'aria-current="date"' : ""}>${d}</button>`;
  }
  const monthName = first.toLocaleDateString("en-US", { timeZone: "UTC", month: "long", year: "numeric" });
  const tf = { hour: "numeric", minute: "2-digit", hourCycle: state.h24 ? "h23" : "h12" };
  const daySlots = byDay.get(state.day) || [];
  const dayLabel = fmt(daySlots[0], { weekday: "long", month: "long", day: "numeric" });
  return `
    <div class="picker">
      <div>
        <div class="cal-head">
          <button type="button" class="navbtn" id="prevM" ${state.month <= minM ? "disabled" : ""} aria-label="Previous month">&#8249;</button>
          <h3>${esc(monthName)}</h3>
          <button type="button" class="navbtn" id="nextM" ${state.month >= maxM ? "disabled" : ""} aria-label="Next month">&#8250;</button>
        </div>
        <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="grid">${cells}</div>
      </div>
      <div class="times">
        <h4>${esc(dayLabel)}</h4>
        <div class="fmt" role="group" aria-label="Time format">
          <button type="button" data-f="12" aria-pressed="${!state.h24}">12h</button><button type="button" data-f="24" aria-pressed="${state.h24}">24h</button>
        </div>
        <div class="tlist">${daySlots.map(s => `<button type="button" class="slot" data-t="${s}">${esc(fmt(s, tf))}</button>`).join("")}</div>
      </div>
    </div>`;
}

function shiftMonth(delta) {
  const [y, m] = state.month.split("-").map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  state.month = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
  const byDay = slotsByDay(); const k = [...byDay.keys()].find(k => k.startsWith(state.month));
  if (k) state.day = k;
  render();
}

function bindPicker() {
  document.querySelectorAll(".day[data-k]").forEach(b => b.onclick = () => { state.day = b.dataset.k; render(); });
  document.querySelectorAll(".slot").forEach(b => b.onclick = () => { state.slot = +b.dataset.t; state.error = ""; render(); });
  document.querySelectorAll(".fmt button").forEach(b => b.onclick = () => { state.h24 = b.dataset.f === "24"; render(); });
  if ($("#prevM")) $("#prevM").onclick = () => shiftMonth(-1);
  if ($("#nextM")) $("#nextM").onclick = () => shiftMonth(1);
}

function renderForm(main) {
  main.innerHTML = `
    <button type="button" class="back-link" id="back">&#8592; Back</button>
    <h2 class="step-title">Enter your details</h2>
    <p class="step-sub">You'll get a calendar invite with the Zoom link right away.</p>
    <div class="summary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f6bdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <div><div class="t">${esc(state.type.long)} with Dexter Magaoay</div><div>${esc(whenText(state.slot))}</div><div style="color:var(--muted);font-size:13px">${esc(tzLabel(state.tz))}</div></div>
    </div>
    <form id="f" novalidate>
      <div><label for="name">Full name</label><input id="name" required maxlength="100" autocomplete="name"></div>
      <div><label for="email">Email</label><input id="email" type="email" required maxlength="200" autocomplete="email"></div>
      <div><label for="company">Company <span class="opt">(optional)</span></label><input id="company" maxlength="120" autocomplete="organization"></div>
      <div><label for="topic">What would you like to discuss? <span class="opt">(optional)</span></label><textarea id="topic" rows="4" maxlength="1000"></textarea></div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      ${state.error ? `<div class="note err">${esc(state.error)}</div>` : ""}
      <div class="row"><button class="btn primary" type="submit" id="submit">Schedule meeting</button></div>
    </form>`;
  $("#back").onclick = () => { state.slot = null; state.error = ""; render(); };
  $("#f").onsubmit = submit;
  $("#name").focus();
}

async function submit(ev) {
  ev.preventDefault();
  const v = id => $("#" + id).value.trim();
  const name = v("name"), email = v("email");
  if (!name || !/^[^\s@"]+@[^\s@"]+\.[^\s@"]+$/.test(email)) { state.error = "Please enter your name and a valid email address."; return renderForm($("#main")); }
  if (v("website")) return;
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Scheduling...";
  const payload = {
    typeId: state.type.id, minutes: String(state.type.minutes),
    start: new Date(state.slot).toISOString(), end: new Date(state.slot + state.type.minutes * 60000).toISOString(),
    name, email, company: v("company"), topic: v("topic"), bookerTz: state.tz, website: "",
  };
  let res;
  try {
    if (DEMO) { await new Promise(r => setTimeout(r, 700)); res = { ok: true, joinUrl: "https://zoom.us/j/preview" }; }
    else {
      const r = await fetch(CONFIG.bookingUrl, { method: "POST", body: new URLSearchParams(payload) });
      res = await r.json().catch(() => ({ ok: false }));
    }
  } catch { res = { ok: false }; }
  if (res.ok) { state.done = { ...payload, joinUrl: res.joinUrl }; return render(); }
  if (res.reason === "taken") { state.slot = null; state.error = "Sorry, that time was just taken. Please choose another time."; return loadBusy(); }
  state.error = `We couldn't complete your booking, and nothing was scheduled. Please try again or email ${CONFIG.contactEmail}.`;
  renderForm($("#main"));
}

function gcalLink(d) {
  const f = s => new Date(s).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const p = new URLSearchParams({ action: "TEMPLATE", text: "Meeting with Dexter Magaoay (NLB)",
    dates: `${f(d.start)}/${f(d.end)}`, details: `Zoom: ${d.joinUrl || ""}`, location: d.joinUrl || "" });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

function renderDone(main) {
  const d = state.done, s = Date.parse(d.start);
  main.innerHTML = `
    <div class="done">
      <div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#169c2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 class="step-title">You're scheduled</h2>
      <p class="step-sub">A calendar invite with the Zoom link was sent to <strong>${esc(d.email)}</strong>.</p>
      <div class="summary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f6bdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div><div class="t">${esc(state.type.long)} with Dexter Magaoay</div><div>${esc(whenText(s))}</div><div style="color:var(--muted);font-size:13px">${esc(tzLabel(state.tz))}</div>
        ${d.joinUrl ? `<div style="margin-top:6px">Zoom: <a href="${esc(d.joinUrl)}" target="_blank" rel="noopener">${esc(d.joinUrl)}</a></div>` : ""}</div>
      </div>
      <div class="row">
        <button class="btn ghost" id="again">Book another time</button>
      </div>
      <p class="step-sub" style="margin-top:18px">Need to change it? Reply to the calendar invite or email <a href="mailto:${CONFIG.contactEmail}">${CONFIG.contactEmail}</a>.</p>
    </div>`;
  $("#again").onclick = () => { state.done = null; state.slot = null; loadBusy(); };
}

render();
loadBusy();
</script>
</body>
</html>
